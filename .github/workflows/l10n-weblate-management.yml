name: l10n - Weblate Management

on:
  workflow_dispatch:
    inputs:
      command:
        description: Weblate management command
        required: true
        default: update
        type: choice
        options:
          - update
          - create
      apply:
        description: Apply changes to Weblate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  l10n-manage:
    name: Run Weblate management command
    runs-on: ubuntu-latest
    environment: weblate

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Run Weblate command
        env:
          WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}
          COMMAND: ${{ inputs.command }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ] && [ "$COMMAND" = "create" ]; then
            yes y | ./scripts/l10n-weblate "$COMMAND" --token "$WEBLATE_TOKEN" --apply
          elif [ "$APPLY" = "true" ]; then
            ./scripts/l10n-weblate "$COMMAND" --token "$WEBLATE_TOKEN" --apply
          else
            ./scripts/l10n-weblate "$COMMAND" --token "$WEBLATE_TOKEN"
          fi
