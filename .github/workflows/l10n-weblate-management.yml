name: l10n - Weblate Management

on:
  workflow_dispatch:
    inputs:
      command:
        description: Weblate management command
        required: true
        default: update
        type: choice
        options:
          - update
          - create
      apply:
        description: Apply changes to Weblate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  l10n-manage:
    name: Run Weblate management command
    runs-on: ubuntu-latest
    environment: weblate

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-disabled: true
          add-job-summary: false

      - name: Run Weblate command
        env:
          WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ] && [ "${{ inputs.command }}" = "create" ]; then
            yes y | script -q -e -c './weblate/scripts/weblate "${{ inputs.command }}" --token "$WEBLATE_TOKEN" --apply' /dev/null
          elif [ "${{ inputs.apply }}" = "true" ]; then
            script -q -e -c './weblate/scripts/weblate "${{ inputs.command }}" --token "$WEBLATE_TOKEN" --apply' /dev/null
          else
            script -q -e -c './weblate/scripts/weblate "${{ inputs.command }}" --token "$WEBLATE_TOKEN"' /dev/null
          fi
